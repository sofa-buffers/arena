# The heap-free half of the Rust maxspeed pair — the corelib-rs analogue of the
# C++ pair (issue #107).
#
# `allow_dynamic: false` makes sofabgen emit heapless::String<N> /
# heapless::Vec<T, N> for every schema-bounded field instead of String / Vec, so
# a decode allocates nothing. Same corelib (corelib-rs, std), same API and same
# wire as ../sofab/cfg.yaml — the only difference is where the field storage
# lives, which is exactly the axis the paired rows isolate. The driver
# (../sofab/bench.rs) is shared verbatim.
#
# Not to be confused with the rust-embedded target: that one is a different
# corelib (corelib-rs-no-std) in the footprint league; this row stays on the std
# corelib and on maxspeed flags, so the pair isolates storage, not the runtime.
generic: { emit: project }
# `heapless: "0.8"` is spelled out rather than left to sofabgen's default: which
# heapless major the generated fixed-capacity fields come from is a cfg option
# since generator#728, and the arena must hold it to 0.8 — RUST_HEAPLESS in
# languages/versions.sh pins the same major in the manifests, because the
# rust-embedded row's micropb baseline wires its containers to heapless 0.8
# (container-heapless-0-8) and the two impls of a row share their deps. Saying it
# here means a generator that moves its default cannot silently generate code for
# the other major against those pinned manifests. The key is inert under
# allow_dynamic: true (no fixed-capacity fields, no heapless dependency), so both
# halves of the pair carry it and the pair still differs in allow_dynamic alone.
targets: { rust: { corelib: rs, allow_dynamic: false, heapless: "0.8" } }

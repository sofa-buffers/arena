# The growable half of the Rust maxspeed pair — see ../sofab-heapless/cfg.yaml.
# allow_dynamic is spelled out rather than left to its default so the two configs
# read as a matched pair differing in exactly one key.
generic: { emit: project }
# heapless 0.8 = RUST_HEAPLESS (languages/versions.sh); inert under allow_dynamic:
# true, kept so the pair differs in allow_dynamic only.
targets: { rust: { corelib: rs, allow_dynamic: true, heapless: "0.8" } }
